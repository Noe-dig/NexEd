<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bit Academy Sign Up</h1>

    <form action="submit"></form>
    <label for="naam">Naam</label><br>
    <input type="text" id="naam" name="naam" placeholder="naam"><br><br>

    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" placeholder="email"><br><br>

    <label for="tel">Telefoonnummer</label><br>
    <input type="tel" id="tel" name="tel" placeholder="telefoonnummer"><br><br>

    <label for="pin">Pin code</label><br>
    <input type="password" id="pin" name="pin"><br><br>

    <label for="provincie">Provincie</label>
    <select name="provincie" id="provincie">
        <option value="Drenthe">Drenthe</option>
        <option value="Flevoland">Flevoland</option>
        <option value="Friesland">Friesland</option>
        <option value="Gelderland">Gelderland</option>
        <option value="Groningen">Groningen</option>
        <option value="Limburg">Limburg</option>
        <option value="Noord Brabant">Noord Brabant</option>
        <option value="Noord Holland">Noord Holland</option>
        <option value="Overijssel">Overijssel</option>
        <option value="Zuid Holland">Zuid Holland</option>
        <option value="Utrecht">Utrecht</option>
        <option value="Zeeland">Zeeland</option>
    </select><br><br>

    <label>Hou je van voetbal?</label><br><br>
    <input type="radio" id="Ja" name="voetbal">
    <label for="Ja">Ja</label><br>
    <input type="radio" id="Nee" name="voetbal">
    <label for="Nee">Nee</label><br><br>
    
    <label>Favoriete dagen in de week</label><br><br>
    <label for="Maandag">Maandag</label>
    <input type="checkbox" name="dagen" id="Maandag"><br>
    
    <label for="Dinsdag">Dinsdag</label>
    <input type="checkbox" name="dagen" id="Dinsdag"><br>
    
    <label for="Woensdag">Woensdag</label>
    <input type="checkbox" name="dagen" id="Woensdag"><br>
    
    <label for="Donderdag">Donderdag</label>
    <input type="checkbox" name="dagen" id="Donderdag"><br>

    <label for="Vrijdag">Vrijdag</label>
    <input type="checkbox" name="dagen" id="Vrijdag"><br>

    <label for="Zaterdag">Zaterdag</label>
    <input type="checkbox" name="dagen" id="Zaterdag"><br>

    <label for="Zondag">Zondag</label>
    <input type="checkbox" name="dagen" id="Zondag"><br><br>

    <textarea name="Textarea" id="textarea"></textarea>

    <input type="submit">
</body>
</html>
