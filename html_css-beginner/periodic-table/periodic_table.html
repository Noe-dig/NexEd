<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <tr>
            <th>Group</th>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th>4</th>
            <th>5</th>
        </tr>
        <tr>
            <th>1</th>
            <td class="orange"><a href="https://en.wikipedia.org/wiki/Helium" target="_blank"><span class="proton-count">1</span><br>H</a></td>
        </tr>
        <tr>
            <th>2</th>
            <td class="purple"><a href="https://en.wikipedia.org/wiki/Lithium" target="_blank"><span class="proton-count">3</span><br>Li</a></td>
            <td class="blue"><a href="https://en.wikipedia.org/wiki/Beryllium" target="_blank"><span class="proton-count">4</span><br>Bi</a></td>
        </tr>
        <tr>
            <th>3</th>
            <td class="purple"><a href="https://en.wikipedia.org/wiki/Sodium" target="_blank"><span class="proton-count">11</span><br>Na</a></td>
            <td class="blue"><a href="https://en.wikipedia.org/wiki/Magnesium" target="_blank"><span class="proton-count">12</span><br>Mg</a></td>
        </tr>
        <tr>
            <th>4</th>
            <td class="purple"><a href="https://en.wikipedia.org/wiki/Potassium" target="_blank"><span class="proton-count">19</span><br>K</a></td>
            <td class="blue"><a href="https://en.wikipedia.org/wiki/Calcium" target="_blank"><span class="proton-count">20</span><br>Ca</a></td>
            <td class="yellow"><a href="https://en.wikipedia.org/wiki/Scandium" target="_blank"><span class="proton-count">21</span><br>Sc</a></td>
            <td class="yellow"><a href="https://en.wikipedia.org/wiki/Titanium" target="_blank"><span class="proton-count">22</span><br>Ti</a></td>
            <td class="yellow"><a href="https://en.wikipedia.org/wiki/Vanadium" target="_blank"><span class="proton-count">23</span><br>V</a></td>
        </tr>
        <tr>
            <th>5</th>
            <td class="purple"><a href="https://en.wikipedia.org/wiki/Rubidium" target="_blank"><span class="proton-count">37</span><br>Rb</a></td>
            <td class="blue"><a href="https://en.wikipedia.org/wiki/Strontium" target="_blank"><span class="proton-count">38</span><br>Sr</a></td>
            <td class="yellow"><a href="https://en.wikipedia.org/wiki/Yttrium" target="_blank"><span class="proton-count">39</span><br>Y</a></td>
            <td class="yellow"><a href="https://en.wikipedia.org/wiki/Zirconium" target="_blank"><span class="proton-count">40</span><br>Zr</a></td>
            <td class="yellow"><a href="https://en.wikipedia.org/wiki/Niobium" target="_blank"><span class="proton-count">41</span><br>Nb</a></td>
        </tr>
    </table>

</html>
